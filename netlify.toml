[functions]
  directory = "netlify/functions"

# Sincronizare automată a calendarului cu ClickUp — în fiecare luni,
# la 03:00 UTC (≈05:00/06:00 ora României). Butonul manual rămâne
# disponibil oricând, separat, pentru sincronizări imediate.
[functions."sync-clickup-scheduled"]
  schedule = "0 3 * * 1"
